<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar refugios — RefugiosBogotá</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    /* ── Dropdown de perfil ── */
    .profile-dropdown { position: relative; }

    .profile-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1.5px solid var(--borde);
      border-radius: 999px;
      padding: 5px 12px 5px 6px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--texto);
      transition: border-color 0.2s, background 0.2s;
    }
    .profile-trigger:hover { border-color: var(--verde-light); background: var(--crema); }

    .profile-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--verde);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .profile-chevron {
      color: var(--texto-3);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .profile-dropdown.open .profile-chevron { transform: rotate(180deg); }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--blanco);
      border: 1.5px solid var(--borde);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
      min-width: 180px;
      padding: 6px;
      z-index: 999;
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
    }
    .profile-dropdown.open .dropdown-menu {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--texto);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
    }
    .dropdown-item:hover { background: var(--crema); }
    .dropdown-item--danger { color: #DC2626; }
    .dropdown-item--danger:hover { background: #FEF2F2; }
  </style>
</head>
<body class="page-app">

  <nav class="nav nav--app" id="nav">
    <div class="nav-inner">
      <a href="animales.html" class="logo">
        <span class="logo-paw">🐾</span>
        <span class="logo-text">Refugios<strong>Bogotá</strong></span>
      </a>
      <div class="nav-app-links">
        <a href="animales.html" class="nav-app-link">Adoptar</a>
        <a href="refugios.html" class="nav-app-link" id="tab-buscar">Buscar refugios</a>
        <a href="reporte-animal.html" class="nav-app-link" id="tab-reporte">Reportar animal</a>
      </div>
      <div class="nav-user" id="nav-user">
        <div class="profile-dropdown" id="profile-dropdown">
          <button class="profile-trigger" id="profile-trigger" onclick="toggleDropdown()">
            <span class="profile-avatar" id="profile-avatar">?</span>
            <span class="profile-name" id="user-greeting"></span>
            <svg class="profile-chevron" width="12" height="12" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="dropdown-menu"><a href="mis-adopciones.html" class="dropdown-item" data-rol="adoptante">🐾 Mis adopciones</a><a href="mis-refugios.html" class="dropdown-item" data-rol="refugio">🏠 Mis refugios</a><a href="perfil.html" class="dropdown-item">👤 Mi perfil</a><a href="registro-refugio.html" class="dropdown-item" data-rol="adoptante">🏠 Registrar refugio</a><a href="admin.html" class="dropdown-item" data-rol="administrador">⚙️ Administración</a><button class="dropdown-item dropdown-item--danger" onclick="cerrarSesion()">↪ Cerrar sesión</button></div>
      </div>
    </div>
  </nav>

  <div class="app-layout">

    <!-- Sidebar filtros -->
    <aside class="filters-sidebar">
      <div class="filters-header">
        <h3>Filtros</h3>
        <button class="btn-clear-filters" onclick="limpiarFiltros()">Limpiar</button>
      </div>

      <!-- S-1: Geolocalización -->
      <div class="filter-group">
        <button class="btn-geolocate" id="btn-geolocate" onclick="usarMiUbicacion()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" opacity=".3"/></svg>
          Usar mi ubicación
        </button>
      </div>

      <div class="filter-group">
        <label class="filter-label">Localidad</label>
        <select id="filtro-localidad" onchange="aplicarFiltros()">
          <option value="">Todas</option>
          <option value="usaquen">Usaquén</option>
          <option value="chapinero">Chapinero</option>
          <option value="santa_fe">Santa Fe</option>
          <option value="kennedy">Kennedy</option>
          <option value="suba">Suba</option>
          <option value="engativa">Engativá</option>
          <option value="bosa">Bosa</option>
          <option value="fontibon">Fontibón</option>
          <option value="teusaquillo">Teusaquillo</option>
          <option value="barrios_unidos">Barrios Unidos</option>
          <option value="ciudad_bolivar">Ciudad Bolívar</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label">Calificación mínima</label>
        <div class="filter-chips">
          <button class="chip active" data-rating="0"   onclick="seleccionarRating(this)">Todas</button>
          <button class="chip"        data-rating="4"   onclick="seleccionarRating(this)">⭐ 4+</button>
          <button class="chip"        data-rating="4.5" onclick="seleccionarRating(this)">⭐ 4.5+</button>
        </div>

      <div class="filter-group">
        <label class="filter-label">Buscar por nombre</label>
        <input type="text" id="filtro-nombre" placeholder="Nombre del refugio..." oninput="aplicarFiltros()"/>
      </div>
    </aside>

    <!-- Contenido principal -->
    <main class="app-main">
      <div class="app-header">
        <div>
          <h1 class="app-title">Buscar refugios</h1>
          <p class="app-sub" id="resultado-count">Mostrando todos los refugios</p>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="btn-grid"  onclick="cambiarVista('grid')"  title="Cuadrícula">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="view-btn" id="btn-lista" onclick="cambiarVista('lista')" title="Lista">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <button class="view-btn" id="btn-mapa" onclick="cambiarVista('mapa')" title="Mapa">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          </button>
        </div>
      </div>

      <!-- Grid de refugios -->
      <div class="refugios-app-grid" id="refugios-grid"></div>

      <!-- Contenedor mapa -->
      <div id="mapa-container" style="display:none">
        <div id="mapa-leaflet" style="height:600px; border-radius:14px; overflow:hidden;"></div>
      </div>

      <!-- Estado vacío -->
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-icon">🔍</div>
        <h3>No se encontraron refugios</h3>
        <p>Intenta con otros criterios o amplía los filtros.</p>
        <button class="btn-primary btn-sm" onclick="limpiarFiltros()">Ver todos</button>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-refugio" class="modal-overlay" onclick="cerrarModal(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="cerrarModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="refugios.js?v=10"></script>
<script src="roles-ui.js?v=10"></script>
</body>
</html>
