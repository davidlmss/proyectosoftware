<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Registrar animal — RefugiosBogotá</title>
<link rel="stylesheet" href="styles.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
.animal-page{max-width:820px;margin:auto;padding:42px 24px 80px}.animal-header{margin-bottom:28px}.animal-header h1{font-family:var(--font-display);font-size:2rem;margin:0 0 8px}.animal-header p{color:var(--texto-2);line-height:1.6}
.animal-card{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radius);padding:28px;margin-bottom:18px}.animal-card h2{font-family:var(--font-display);font-size:1.1rem;margin:0 0 20px;padding-bottom:12px;border-bottom:1px solid var(--crema-2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:2px}.field.full{grid-column:1/-1}.field label{display:block;font-size:.82rem;font-weight:600;color:var(--texto-2);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--borde);border-radius:var(--radius-sm);font:inherit;color:var(--texto);background:var(--blanco);outline:none}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--verde-light);box-shadow:0 0 0 3px var(--verde-glow)}.hint{font-size:.74rem;color:var(--texto-3);margin-top:4px}.error{color:#DC2626;font-size:.76rem;margin-top:4px;min-height:16px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.alert{display:none;padding:12px 14px;border-radius:10px;margin-bottom:18px;background:#FEF2F2;color:#B91C1C}.success{display:none;text-align:center;padding:30px}.success h2{font-family:var(--font-display);margin-bottom:8px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body class="page-app">
<nav class="nav nav--app"><div class="nav-inner">
<a href="animales.html" class="logo"><span class="logo-paw">🐾</span><span class="logo-text">Refugios<strong>Bogotá</strong></span></a>
<div class="nav-app-links">
<a href="refugios.html" class="nav-app-link">Refugios</a><a href="animales.html" class="nav-app-link">Adoptar</a><a href="registro-refugio.html" class="nav-app-link" data-rol="adoptante,refugio">Registrar refugio</a><a href="registrar-animal.html" class="nav-app-link active">Registrar animal</a>
</div>
<div class="nav-user"><button class="btn-nav-outline" onclick="cerrarSesion()">Cerrar sesión</button></div>
</div></nav>
<main class="animal-page">
<div class="animal-header"><h1>Registrar perro</h1><p>Agrega un perro al refugio desde el que estás realizando este registro.</p><div id="refugio-contexto" style="margin-top:14px;padding:12px 15px;border:1px solid var(--borde);border-radius:10px;background:var(--crema);font-weight:600;color:var(--texto)">🏠 Cargando refugio...</div></div>
<div id="alert" class="alert"></div>
<form id="form-animal">
<section class="animal-card"><h2>Información del animal</h2><div class="form-grid">
<input type="hidden" id="id_refugio"/>
<div class="field"><label>Nombre *</label><input id="nombre" maxlength="80" required placeholder="Ej. Max"/><div id="e-nombre" class="error"></div></div>
<div class="field"><label>Raza</label><input id="raza" maxlength="80" placeholder="Ej. Criollo, Labrador..."/></div>
<div class="field"><label>Sexo</label><select id="sexo"><option value="no_determinado">No determinado</option><option value="macho">Macho</option><option value="hembra">Hembra</option></select></div>
<div class="field"><label>Edad aproximada</label><input id="edad" maxlength="40" placeholder="Ej. 2 años"/></div>
<div class="field"><label>Tamaño</label><select id="tamano"><option value="">No especificado</option><option value="pequeno">Pequeño</option><option value="mediano">Mediano</option><option value="grande">Grande</option></select></div>
<div class="field"><label>Color</label><input id="color" maxlength="60" placeholder="Ej. Café y blanco"/></div>
<div class="field"><label>Estado de salud</label><select id="estado_salud"><option value="estable">Estable</option><option value="en_tratamiento">En tratamiento</option><option value="recuperacion">En recuperación</option><option value="especial">Requiere cuidados especiales</option><option value="embarazo">En embarazo</option></select></div>
<div class="field"><label>Fotos (URLs)</label><input id="fotos_urls" placeholder="https://... , https://..."/><div class="hint">Puedes separar varias URL con comas.</div></div>
<div class="field full"><label>Descripción *</label><textarea id="descripcion" maxlength="1000" required placeholder="Describe personalidad, comportamiento y cualquier información importante para el adoptante."></textarea><div id="e-descripcion" class="error"></div></div>
</div></section>
<div class="actions"><a href="animales.html" class="btn-ghost btn-lg">Cancelar</a><button class="btn-primary btn-lg" type="submit" id="submit">Registrar animal</button></div>
</form>
<div id="success" class="animal-card success"><div style="font-size:3rem">🐾</div><h2>Animal registrado</h2><p id="success-text"></p><a href="animales.html" class="btn-primary btn-lg">Ver animales para adopción</a></div>
</main>
<script src="registrar-animal.js"></script>
<script src="roles-ui.js"></script>
</body></html>
