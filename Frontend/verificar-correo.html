<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar correo — RefugiosBogotá</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .verify-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f7f6}
    .verify-card{max-width:520px;width:100%;background:#fff;border-radius:16px;padding:36px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    .verify-icon{font-size:52px;margin-bottom:12px}
    .verify-card h1{margin:0 0 12px}
    .verify-card p{line-height:1.6;color:#54615b}
    .verify-card .btn-primary{display:inline-block;margin-top:16px;text-decoration:none}
  </style>
</head>
<body>
  <main class="verify-wrap">
    <section class="verify-card">
      <div class="verify-icon" id="verify-icon">⏳</div>
      <h1 id="verify-title">Confirmando correo...</h1>
      <p id="verify-message">Espera un momento mientras validamos tu dirección de correo electrónico.</p>
      <a id="verify-login" href="login.html" class="btn-primary" style="display:none">Ir a iniciar sesión</a>
      <a href="index.html" class="btn-ghost-sm" style="display:inline-block;margin-top:12px">Volver al inicio</a>
    </section>
  </main>
  <script src="verificar-correo.js"></script>
</body>
</html>
