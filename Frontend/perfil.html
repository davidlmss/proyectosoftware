<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mi perfil — RefugiosBogotá</title><link rel="stylesheet" href="styles.css">
<style>
.profile-page{max-width:820px;margin:40px auto;padding:0 20px}.profile-card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-field{margin-bottom:4px}.profile-field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px;color:var(--texto-2)}.profile-field input,.profile-field select{width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--borde);border-radius:9px;background:#fff}.profile-field input:disabled{background:#f3f4f6;color:#6b7280}.role-box{display:flex;align-items:center;gap:12px;background:var(--crema);border:1px solid var(--borde);padding:14px;border-radius:12px;margin:18px 0}.role-badge{font-weight:700;padding:6px 10px;border-radius:999px;background:#1b5e3b;color:#fff}.profile-actions{display:flex;gap:10px;align-items:center;margin-top:20px}.profile-msg{min-height:22px;color:#1b5e3b;font-weight:600}@media(max-width:650px){.profile-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="page-app">
<nav class="nav nav--app"><div class="nav-inner"><a href="animales.html" class="logo"><span class="logo-paw">🐾</span><span class="logo-text">Refugios<strong>Bogotá</strong></span></a><div class="nav-user"><a class="btn-ghost" href="index.html">Inicio</a><button class="btn-nav-outline" onclick="cerrarSesion()">Cerrar sesión</button></div></div></nav>
<main class="profile-page"><div class="profile-card"><a href="javascript:history.back()" class="btn-ghost">← Volver</a><h1>Mi perfil</h1><p>Consulta y actualiza tus datos personales. El tipo de usuario se muestra para evitar confusiones.</p><div class="role-box"><span>Tipo de usuario:</span><span id="rol" class="role-badge">—</span><span id="estado-refugio" class="muted"></span></div>
<form id="perfil-form"><div class="profile-grid"><div class="profile-field"><label>Nombre</label><input id="nombre" required></div><div class="profile-field"><label>Apellido</label><input id="apellido" required></div><div class="profile-field"><label>Correo</label><input id="correo" disabled></div><div class="profile-field"><label>Localidad</label><select id="ubicacion" required><option value="">Selecciona</option><option value="usaquen">Usaquén</option><option value="chapinero">Chapinero</option><option value="santa_fe">Santa Fe</option><option value="san_cristobal">San Cristóbal</option><option value="usme">Usme</option><option value="tunjuelito">Tunjuelito</option><option value="bosa">Bosa</option><option value="kennedy">Kennedy</option><option value="fontibon">Fontibón</option><option value="engativa">Engativá</option><option value="suba">Suba</option><option value="barrios_unidos">Barrios Unidos</option><option value="teusaquillo">Teusaquillo</option><option value="los_martires">Los Mártires</option><option value="antonio_narino">Antonio Nariño</option><option value="puente_aranda">Puente Aranda</option><option value="candelaria">La Candelaria</option><option value="rafael_uribe">Rafael Uribe Uribe</option><option value="ciudad_bolivar">Ciudad Bolívar</option></select></div><div class="profile-field"><label>Nueva contraseña (opcional)</label><input id="contrasena" type="password" minlength="8" placeholder="Déjala vacía para conservarla"></div></div><div class="profile-actions"><button class="btn-primary" type="submit">Guardar cambios</button><span id="mensaje" class="profile-msg"></span></div></form></div></main>
<script>
const API='/api';const token=sessionStorage.getItem('token')||localStorage.getItem('token');
const LOC={usaquen:'Usaquén',chapinero:'Chapinero',santa_fe:'Santa Fe',san_cristobal:'San Cristóbal',usme:'Usme',tunjuelito:'Tunjuelito',bosa:'Bosa',kennedy:'Kennedy',fontibon:'Fontibón',engativa:'Engativá',suba:'Suba',barrios_unidos:'Barrios Unidos',teusaquillo:'Teusaquillo',los_martires:'Los Mártires',antonio_narino:'Antonio Nariño',puente_aranda:'Puente Aranda',candelaria:'La Candelaria',rafael_uribe:'Rafael Uribe Uribe',ciudad_bolivar:'Ciudad Bolívar'};
function rolTexto(r){return r==='administrador'?'Administrador':r==='refugio'?'Refugio':'Adoptante'}
async function cargar(){if(!token){location.href='login.html';return}try{const r=await fetch(API+'/perfil',{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!j.exito){alert(j.mensaje||'Sesión inválida');location.href='login.html';return}const u=j.usuario;['nombre','apellido','correo','ubicacion'].forEach(k=>document.getElementById(k).value=u[k]||'');document.getElementById('rol').textContent=rolTexto(u.rol);document.getElementById('estado-refugio').textContent=u.estado_refugio&&u.rol==='refugio'?`Estado del refugio: ${u.estado_refugio}`:'';}catch(e){alert('No se pudo cargar el perfil.')}}
document.getElementById('perfil-form').addEventListener('submit',async e=>{e.preventDefault();const mensaje=document.getElementById('mensaje');mensaje.textContent='Guardando...';const body={nombre:document.getElementById('nombre').value,apellido:document.getElementById('apellido').value,ubicacion:document.getElementById('ubicacion').value,contrasena:document.getElementById('contrasena').value};try{const r=await fetch(API+'/perfil',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)}),j=await r.json();if(!j.exito){mensaje.style.color='#b91c1c';mensaje.textContent=j.mensaje||j.errores?JSON.stringify(j.errores||j.mensaje):'No se pudo guardar.';return}const storage=JSON.stringify(j.usuario);sessionStorage.setItem('usuario',storage);if(localStorage.getItem('usuario'))localStorage.setItem('usuario',storage);document.getElementById('contrasena').value='';mensaje.style.color='#1b5e3b';mensaje.textContent=j.mensaje;setTimeout(()=>mensaje.textContent='',3000);}catch(e){mensaje.style.color='#b91c1c';mensaje.textContent='No se pudo conectar al servidor.'}});
function cerrarSesion(){sessionStorage.clear();localStorage.clear();location.href='login.html'}cargar();
</script></body></html>
